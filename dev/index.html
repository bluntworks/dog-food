<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DogFoodCalc — local dev host</title>
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        font-family: "Poppins", system-ui, sans-serif;
        color: #1f3d2b;
      }
      body {
        margin: 0;
        background: #ffffff;
      }
      .host {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2.5rem 1.25rem;
      }
      .host-note {
        font-size: 0.85rem;
        color: #6b7280;
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <div class="host">
      <p class="host-note">
        Local Duda host simulator — the widget below auto-mounts on
        <code>[data-dogfood-calc]</code>.
      </p>

      <div
        data-dogfood-calc
        data-heading="Build your dog's feeding plan"
        data-subheading="Tell us a bit about your dog and we'll work out their daily energy needs."
        data-cta-label="Calculate daily portion"
        data-food-kcal-per-kg="1345"
        data-kibble-kcal-per-kg="1345"
        data-food-split-percent="80"
        data-default-mode="mixed"
        data-enable-mixed-mode="true"
      ></div>
    </div>

    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
